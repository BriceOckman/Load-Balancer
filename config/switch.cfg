# Load balancer simulation - switch (bonus) configuration
# Same settings as default.cfg, with the Switch enabled and the initial
# server pool split by job type.

num_servers              = 20
run_cycles               = 100000
initial_queue_multiplier = 100
seed                     = 42

min_task_time            = 10
max_task_time            = 100
arrival_probability      = 0.30
max_burst                = 3
streaming_ratio          = 0.30

scale_low_ratio          = 50
scale_high_ratio         = 80
scale_cooldown           = 50
min_servers              = 1
max_servers              = 1000

blocked_range            = 10.0.0.0-10.255.255.255
blocked_range            = 192.168.0.0/16
attack_probability       = 0.02
attack_range             = 10.0.0.0-10.0.255.255

verbose                  = true
use_color                = true
log_file                 = logs/loadbalancer.log
status_interval          = 1000

switch_enabled           = true
processing_servers       = 14
streaming_servers        = 6
